<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McDaniel · 书架</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--wall:#f4efe6;--wall2:#e8e0d3;--wood:#8b6e54;--wood2:#a68465;--shadow:#3d3226;--page:#fdfaf3;--page2:#f5efe4;--ink:#2d2014;--inkdim:#8a7a66;--gold:#b8892e;--gold2:#d4af5e;--b1:#963838;--b2:#5e7344;--b3:#3d5170;--b4:#c07840;--b5:#5a4336}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Serif SC','Georgia',serif;background:var(--wall);color:var(--ink);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ===== 壁纸背景 ===== */
.library{min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--wall2) 0%,var(--wall) 70%)}
.library::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,transparent 40%,rgba(61,50,38,0.08) 100%);pointer-events:none;z-index:1}

/* ===== 顶栏 ===== */
.header{width:100%;padding:1.8rem 3rem 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10}
.logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--ink);letter-spacing:1px}
.logo span{color:var(--b1);font-style:italic;font-weight:400;font-size:0.9rem;margin-left:0.4rem}
.header-hint{font-size:0.78rem;color:var(--inkdim);letter-spacing:2px}

/* ===== 标题 ===== */
.title-area{text-align:center;padding:2rem 2rem 1rem;position:relative;z-index:10}
.title-area h1{font-family:'Playfair Display',serif;font-size:3rem;font-weight:500;color:var(--ink);line-height:1.2}
.title-area h1 em{font-style:italic}
.title-area p{color:var(--inkdim);font-size:0.95rem;margin-top:0.6rem;letter-spacing:3px}

/* ===== 书架 ===== */
.shelf-stage{position:relative;z-index:10;width:100%;max-width:1100px;padding:0 2rem 3rem;display:flex;flex-direction:column;align-items:center}
.books-row{display:flex;gap:2.5rem;align-items:flex-end;perspective:1200px;justify-content:center;flex-wrap:wrap}

/* ===== 单本书 ===== */
.book{position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.25,0.1,0.25,1);width:135px}
.book:hover{transform:translateY(-18px) rotateX(-6deg)}
.book:hover .book-spine{box-shadow:8px 16px 32px rgba(61,50,38,0.35),inset 0 1px 0 rgba(255,255,255,0.15)}

/* 书脊 */
.book-spine{width:100%;height:340px;border-radius:3px 6px 6px 3px;position:relative;overflow:hidden;box-shadow:4px 10px 24px rgba(61,50,38,0.18),inset 0 1px 0 rgba(255,255,255,0.1);transition:box-shadow 0.55s cubic-bezier(0.25,0.1,0.25,1);display:flex;flex-direction:column;align-items:center;justify-content:center}
.book-spine::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background:var(--gold2);opacity:0.5}
.book-spine::after{content:'';position:absolute;bottom:0;left:0;right:0;height:8px;background:var(--gold2);opacity:0.5}

.book:nth-child(1) .book-spine{background:linear-gradient(180deg,var(--b1) 0%,#7a2d2d 100%)}
.book:nth-child(2) .book-spine{background:linear-gradient(180deg,var(--b2) 0%,#4a5c35 100%)}
.book:nth-child(3) .book-spine{background:linear-gradient(180deg,var(--b3) 0%,#2d3e58 100%)}
.book:nth-child(4) .book-spine{background:linear-gradient(180deg,var(--b4) 0%,#a06030 100%)}
.book:nth-child(5) .book-spine{background:linear-gradient(180deg,var(--b5) 0%,#3d2a1e 100%)}

/* 书脊布纹纹理 */
.book-spine .texture{position:absolute;inset:8px 0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.02) 3px,rgba(255,255,255,0.02) 4px);pointer-events:none}

/* 书脊标题 */
.book-title{font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;color:var(--gold2);writing-mode:vertical-rl;letter-spacing:4px;position:relative;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,0.3);user-select:none}

/* 书脊上的金色装饰线 */
.spine-deco{position:absolute;left:50%;transform:translateX(-50%);width:40px;height:1px;background:var(--gold);opacity:0.6;z-index:2}
.spine-deco.top{top:28px}.spine-deco.bot{bottom:28px}

/* 书的侧面厚度（3D 用阴影模拟） */
.book-edge{position:absolute;right:-6px;top:0;bottom:0;width:6px;border-radius:0 4px 4px 0;z-index:-1}
.book:nth-child(1) .book-edge{background:linear-gradient(180deg,#6a2424,#5a1e1e)}
.book:nth-child(2) .book-edge{background:linear-gradient(180deg,#3e4e2e,#344226)}
.book:nth-child(3) .book-edge{background:linear-gradient(180deg,#263548,#1f2a3d)}
.book:nth-child(4) .book-edge{background:linear-gradient(180deg,#8a4a28,#704020)}
.book:nth-child(5) .book-edge{background:linear-gradient(180deg,#2e1c12,#22140c)}

/* 书架木板 */
.shelf-board{width:100%;max-width:1100px;height:22px;background:linear-gradient(180deg,var(--wood2) 0%,var(--wood) 40%,#6b523a 100%);border-radius:2px;box-shadow:0 6px 20px rgba(61,50,38,0.25),0 2px 0 rgba(255,255,255,0.08) inset;position:relative;margin-top:-4px}
.shelf-board::after{content:'';position:absolute;bottom:-14px;left:0;right:0;height:14px;background:linear-gradient(180deg,rgba(61,50,38,0.25),transparent)}

/* 装饰：小台灯 */
.lamp{position:absolute;right:20px;top:-140px;z-index:3;opacity:0.5;pointer-events:none}
.lamp-shade{width:50px;height:32px;background:linear-gradient(180deg,#c9942e,#a07020);border-radius:30px 30px 0 0;margin:0 auto;box-shadow:0 -4px 12px rgba(200,150,50,0.4)}
.lamp-neck{width:3px;height:80px;background:var(--inkdim);margin:0 auto}
.lamp-base{width:36px;height:8px;background:var(--inkdim);border-radius:2px;margin:0 auto}
.lamp-glow{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:120px;height:80px;background:radial-gradient(ellipse at top,rgba(255,220,140,0.3),transparent 70%)}

/* ===== 翻开书籍 Overlay ===== */
.book-overlay{position:fixed;inset:0;background:rgba(20,14,10,0.7);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.5s ease,backdrop-filter 0.5s ease;backdrop-filter:blur(0px)}
.book-overlay.active{opacity:1;pointer-events:auto;backdrop-filter:blur(8px)}

/* 打开的书 */
.open-book{width:min(880px,92vw);height:min(560px,70vh);display:flex;position:relative;transform:scale(0.85);transition:transform 0.55s cubic-bezier(0.25,0.1,0.25,1);filter:drop-shadow(0 20px 60px rgba(20,14,10,0.5))}
.book-overlay.active .open-book{transform:scale(1)}

/* 页面背景（多页堆叠效果） */
.open-book::before{content:'';position:absolute;inset:-3px;background:linear-gradient(180deg,var(--page2),var(--page));border-radius:2px 8px 8px 2px;z-index:-1;box-shadow:0 2px 0 #ece4d4,0 4px 0 #e8dfcc,0 6px 0 #e4dac4}

/* 左页 */
.page{flex:1;background:linear-gradient(90deg,var(--page2) 0%,var(--page) 15%);position:relative;padding:3rem 2.5rem;display:flex;flex-direction:column;overflow:hidden}
.page-left{border-right:1px solid rgba(0,0,0,0.06);border-radius:4px 0 0 4px;box-shadow:inset -12px 0 18px -12px rgba(0,0,0,0.06)}
.page-right{border-radius:0 4px 4px 0;box-shadow:inset 4px 0 10px -4px rgba(0,0,0,0.04)}

/* 书缝（中缝阴影） */
.crease{position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,0.03) 40%,rgba(0,0,0,0.08) 50%,rgba(0,0,0,0.03) 60%,transparent 100%);z-index:5;pointer-events:none}

/* 页码 */
.page-num{position:absolute;bottom:1.5rem;font-size:0.75rem;color:var(--inkdim);font-family:'Playfair Display',serif;letter-spacing:1px}
.page-left .page-num{left:2.5rem}
.page-right .page-num{right:2.5rem}

/* 左页内容 */
.page-left .chapter-num{font-family:'Playfair Display',serif;font-size:5rem;color:var(--gold2);line-height:1;margin-bottom:0.5rem;font-weight:700;opacity:0.7}
.page-left .chapter-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--ink);margin-bottom:1rem;line-height:1.2}
.page-left .chapter-desc{font-size:0.9rem;color:var(--inkdim);line-height:1.8;font-style:italic}

/* 左页装饰线 */
.chapter-line{width:60px;height:2px;background:var(--gold);margin:1.2rem 0;opacity:0.6}

/* 右页内容 */
.page-right h3{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--ink);margin-bottom:1.2rem;border-bottom:1px solid rgba(0,0,0,0.08);padding-bottom:0.6rem}

/* 项目卡片（模块3） */
.project-list{display:flex;flex-direction:column;gap:0.6rem}
.project-item{display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0.8rem;border-left:2px solid var(--gold2);background:rgba(255,255,255,0.3);border-radius:0 6px 6px 0;transition:all 0.3s;cursor:default}
.project-item:hover{border-left-color:var(--gold);background:rgba(255,255,255,0.5);transform:translateX(3px)}
.project-item strong{font-size:0.95rem;color:var(--ink);min-width:85px}
.project-item span{font-size:0.8rem;color:var(--inkdim)}

/* 技能标签（模块2） */
.skill-tags{display:flex;flex-wrap:wrap;gap:0.5rem}
.skill-tag{padding:0.35rem 0.75rem;border:1px solid rgba(0,0,0,0.1);border-radius:3px;font-size:0.8rem;color:var(--inkdim);background:rgba(255,255,255,0.4);transition:all 0.3s}
.skill-tag:hover{border-color:var(--gold);color:var(--ink);background:rgba(255,255,255,0.7)}

/* 经历列表（模块4） */
.timeline{display:flex;flex-direction:column;gap:0.8rem}
.timeline-item{display:flex;gap:1rem;align-items:baseline}
.timeline-year{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--gold);min-width:50px}
.timeline-text{font-size:0.85rem;color:var(--inkdim);line-height:1.6}
.timeline-text strong{color:var(--ink);display:block}

/* 联系信息（模块5） */
.contact-grid{display:flex;flex-direction:column;gap:0.8rem}
.contact-row{display:flex;align-items:center;gap:0.6rem;font-size:0.85rem;color:var(--inkdim)}
.contact-row .label{font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);min-width:55px;font-size:0.85rem}

/* 关于我文字（模块1） */
.about-text{font-size:0.92rem;color:var(--inkdim);line-height:2;margin-bottom:1rem}
.about-text strong{color:var(--ink)}

/* 关闭按钮 */
.close-btn{position:absolute;top:1rem;right:1.5rem;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.6);cursor:pointer;font-size:1.2rem;color:var(--inkdim);display:flex;align-items:center;justify-content:center;transition:all 0.3s;backdrop-filter:blur(4px)}
.close-btn:hover{background:rgba(255,255,255,0.9);color:var(--ink);border-color:rgba(0,0,0,0.2)}

/* 页脚 */
.footer{text-align:center;padding:2rem;color:var(--inkdim);font-size:0.8rem;letter-spacing:2px;position:relative;z-index:10}

/* ===== 响应式 ===== */
@media(max-width:768px){
.book{width:90px}.book-spine{height:240px}.book-title{font-size:0.7rem;letter-spacing:2px}.books-row{gap:1rem}
.open-book{flex-direction:column;height:auto;min-height:80vh}
.page{padding:1.5rem}.page-left,.page-right{border-radius:0}.page-left{border-right:none;border-bottom:1px solid rgba(0,0,0,0.06)}
.page-left .chapter-num{font-size:3rem}
}
</style>
</head>
<body>

<div class="library" id="library">
    <!-- 顶栏 -->
    <div class="header">
        <div class="logo">McDaniel<span>· 藏书</span></div>
        <div class="header-hint">CLICK A BOOK</div>
    </div>

    <!-- 标题 -->
    <div class="title-area">
        <h1><em>The</em> Library</h1>
        <p>点击书本，翻阅我的故事</p>
    </div>

    <!-- 书架 -->
    <div class="shelf-stage" style="position:relative">
        <!-- 装饰台灯 -->
        <div class="lamp"><div class="lamp-glow"></div><div class="lamp-shade"></div><div class="lamp-neck"></div><div class="lamp-base"></div></div>

        <div class="books-row" id="booksRow">
            <!-- 书 ① 关于我 -->
            <div class="book" data-book="1" onclick="openBook(1)">
                <div class="book-spine">
                    <div class="texture"></div>
                    <div class="spine-deco top"></div>
                    <div class="book-title">关于我</div>
                    <div class="spine-deco bot"></div>
                </div>
                <div class="book-edge"></div>
            </div>

            <!-- 书 ② 技能 -->
            <div class="book" data-book="2" onclick="openBook(2)">
                <div class="book-spine">
                    <div class="texture"></div>
                    <div class="spine-deco top"></div>
                    <div class="book-title">技能栈</div>
                    <div class="spine-deco bot"></div>
                </div>
                <div class="book-edge"></div>
            </div>

            <!-- 书 ③ 项目 -->
            <div class="book" data-book="3" onclick="openBook(3)">
                <div class="book-spine">
                    <div class="texture"></div>
                    <div class="spine-deco top"></div>
                    <div class="book-title">项目集</div>
                    <div class="spine-deco bot"></div>
                </div>
                <div class="book-edge"></div>
            </div>

            <!-- 书 ④ 经历 -->
            <div class="book" data-book="4" onclick="openBook(4)">
                <div class="book-spine">
                    <div class="texture"></div>
                    <div class="spine-deco top"></div>
                    <div class="book-title">履历</div>
                    <div class="spine-deco bot"></div>
                </div>
                <div class="book-edge"></div>
            </div>

            <!-- 书 ⑤ 联系 -->
            <div class="book" data-book="5" onclick="openBook(5)">
                <div class="book-spine">
                    <div class="texture"></div>
                    <div class="spine-deco top"></div>
                    <div class="book-title">联系我</div>
                    <div class="spine-deco bot"></div>
                </div>
                <div class="book-edge"></div>
            </div>
        </div>

        <!-- 书架木板 -->
        <div class="shelf-board"></div>
    </div>

    <!-- 页脚 -->
    <div class="footer">2026 · 由 GitHub MCP 手工装订 · 共五卷</div>
</div>

<!-- ===== 翻开的书（Overlay）===== -->
<div class="book-overlay" id="bookOverlay" onclick="closeBook(event)">
    <button class="close-btn" onclick="closeBook()">×</button>
    <div class="open-book" id="openBook" onclick="event.stopPropagation()">
        <div class="page page-left">
            <div class="chapter-num" id="chapterNum">I</div>
            <div class="chapter-title" id="chapterTitle">关于我</div>
            <div class="chapter-line"></div>
            <div class="chapter-desc" id="chapterDesc"></div>
            <div class="page-num" id="pageNumLeft">1</div>
        </div>
        <div class="page page-right" id="pageRight">
            <div id="pageContent"></div>
            <div class="page-num" id="pageNumRight">2</div>
        </div>
        <div class="crease"></div>
    </div>
</div>

<script>
const books={
1:{num:'I',title:'关于我',desc:'翻开第一卷，了解作者其人。',leftPage:1,rightPage:2,
content:'<h3>作者简介</h3><p class="about-text">我是 <strong>McDaniel</strong>，一名全栈工程师，同时也是一位热爱纸书的藏书人。</p><p class="about-text">我坚信<strong>好的代码和好书一样</strong>——结构清晰、质感温润、值得反复品读。从事开发工作五年，始终以工匠精神对待每一行代码、每一个像素。</p><p class="about-text">这本"书架"正是我的人生态度：<strong>不追逐浮华，只打磨质地。</strong></p>'},
2:{num:'II',title:'技能栈',desc:'工具与技艺，如同书架上不同的学科分类。',leftPage:3,rightPage:4,
content:'<h3>技术能力</h3><div class="skill-tags"><span class="skill-tag">TypeScript</span><span class="skill-tag">React</span><span class="skill-tag">Vue</span><span class="skill-tag">Node.js</span><span class="skill-tag">Python</span><span class="skill-tag">Go</span><span class="skill-tag">PostgreSQL</span><span class="skill-tag">Redis</span><span class="skill-tag">Docker</span><span class="skill-tag">Kubernetes</span><span class="skill-tag">AWS</span><span class="skill-tag">GitHub Actions</span><span class="skill-tag">Figma</span><span class="skill-tag">CSS 3D</span></div>'},
3:{num:'III',title:'项目集',desc:'每一本书都是一次亮相。以下，我的代表作。',leftPage:5,rightPage:6,
content:'<h3>精选项目</h3><div class="project-list"><div class="project-item"><strong>Nebula UI</strong><span>3D 视差 React 组件库</span></div><div class="project-item"><strong>Pulse Analytics</strong><span>百万级数据可视化平台</span></div><div class="project-item"><strong>Aurora Editor</strong><span>协作光标在线代码编辑器</span></div><div class="project-item"><strong>Vortex Mail</strong><span>极简键盘流邮件客户端</span></div><div class="project-item"><strong>Stellar Notes</strong><span>Tauri 本地优先笔记应用</span></div></div>'},
4:{num:'IV',title:'履历',desc:'时间轴上，每一段经历都是一卷藏书。',leftPage:7,rightPage:8,
content:'<h3>工作经历</h3><div class="timeline"><div class="timeline-item"><span class="timeline-year">2025—</span><span class="timeline-text"><strong>高级前端工程师 · Nebula Lab</strong>主导 UI 组件库与设计体系</span></div><div class="timeline-item"><span class="timeline-year">2023—25</span><span class="timeline-text"><strong>全栈工程师 · Pulse Tech</strong>数据可视化平台架构设计</span></div><div class="timeline-item"><span class="timeline-year">2021—23</span><span class="timeline-text"><strong>前端开发 · Aurora Studio</strong>协作编辑器核心体验</span></div></div>'},
5:{num:'V',title:'联系我',desc:'打开最后一卷，找到我。',leftPage:9,rightPage:10,
content:'<h3>联系方式</h3><div class="contact-grid"><div class="contact-row"><span class="label">Email</span>mcdaniel@example.dev</div><div class="contact-row"><span class="label">GitHub</span>@McDaniel2</div><div class="contact-row"><span class="label">Twitter</span>@mcdaniel_dev</div><div class="contact-row"><span class="label">位置</span>Shanghai · CN</div><div class="contact-row"><span class="label">话语</span>用代码装订世界。</div></div>'}
};

function openBook(id){
const b=books[id];
document.getElementById('chapterNum').textContent=b.num;
document.getElementById('chapterTitle').textContent=b.title;
document.getElementById('chapterDesc').textContent=b.desc;
document.getElementById('pageNumLeft').textContent=b.leftPage;
document.getElementById('pageNumRight').textContent=b.rightPage;
document.getElementById('pageContent').innerHTML=b.content;
document.getElementById('bookOverlay').classList.add('active');
document.body.style.overflow='hidden';
}

function closeBook(e){
if(e&&e.target!==document.getElementById('bookOverlay')&&e.target!==e.currentTarget)return;
document.getElementById('bookOverlay').classList.remove('active');
document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('bookOverlay').classList.remove('active');document.body.style.overflow='';}});
</script>
</body>
</html>
